<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lolo y la Yaya — La música de Lolo y la Yaya</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --crema: #f3ead8;
      --crema-claro: #fffaf0;
      --azul: #1673a8;
      --azul-oscuro: #123f63;
      --azul-suave: #c8e0e9;
      --marron: #69452e;
      --dorado: #c99a51;
      --verde: #708d67;
      --texto: #29343a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background-color: #f3ead8;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #f3ead8;
      color: var(--texto);
      font-family: "Nunito", sans-serif;
      overflow-x: hidden;
    }

    /*
      Esta capa contiene TODO el fondo.
      Así evitamos que Safari o Chrome móvil muestren
      negro detrás de body o de elementos fixed.
    */

    .pagina {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 50% 8%,
          rgba(255,255,255,.72) 0%,
          rgba(255,255,255,.22) 28%,
          transparent 58%
        ),
        linear-gradient(
          180deg,
          #f8f0df 0%,
          #f3ead8 52%,
          #eee0c9 100%
        );
    }

    /*
      PATRÓN DEL FONDO
    */

    .textura {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .5;
      background-image:
        radial-gradient(
          circle at 2px 2px,
          rgba(18,63,99,.14) 1px,
          transparent 1.2px
        ),
        radial-gradient(
          circle at 18px 18px,
          rgba(201,154,81,.13) 1px,
          transparent 1.3px
        );
      background-size: 36px 36px;
    }

    .textura-lineas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .2;
      background:
        repeating-linear-gradient(
          115deg,
          transparent 0px,
          transparent 72px,
          rgba(18,63,99,.18) 73px,
          transparent 74px,
          transparent 145px
        );
    }

    /*
      UNIVERSO DECORATIVO
    */

    .universo {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orbita {
      position: absolute;
      width: 135vw;
      height: 42vw;
      left: -18vw;
      top: 130px;
      border: 1.5px dashed rgba(18,63,99,.22);
      border-radius: 50%;
      transform: rotate(-10deg);
    }

    .orbita-2 {
      position: absolute;
      width: 120vw;
      height: 35vw;
      right: -48vw;
      top: 580px;
      border: 1px dashed rgba(22,115,168,.18);
      border-radius: 50%;
      transform: rotate(14deg);
    }

    .orbita-3 {
      position: absolute;
      width: 110vw;
      height: 32vw;
      left: -35vw;
      bottom: 110px;
      border: 1px dashed rgba(105,69,46,.14);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    .estrella {
      position: absolute;
      color: var(--azul);
      line-height: 1;
      animation: destellar 4s ease-in-out infinite;
    }

    .estrella-1 {
      top: 95px;
      left: 8%;
      font-size: 18px;
    }

    .estrella-2 {
      top: 220px;
      right: 8%;
      font-size: 12px;
      animation-delay: 1s;
    }

    .estrella-3 {
      top: 430px;
      left: 6%;
      font-size: 15px;
      animation-delay: 2s;
    }

    .estrella-4 {
      top: 680px;
      right: 7%;
      font-size: 19px;
      animation-delay: .5s;
    }

    .estrella-5 {
      top: 950px;
      left: 10%;
      font-size: 11px;
      animation-delay: 2.7s;
    }

    .estrella-6 {
      bottom: 110px;
      right: 11%;
      font-size: 16px;
      animation-delay: 1.5s;
    }

    @keyframes destellar {
      0%, 100% {
        opacity: .25;
        transform: scale(.75) rotate(0deg);
      }

      50% {
        opacity: 1;
        transform: scale(1.2) rotate(12deg);
      }
    }

    /*
      ESTRELLA FUGAZ
    */

    .fugaz {
      position: absolute;
      top: 150px;
      right: 4%;
      width: 125px;
      height: 2px;
      border-radius: 10px;
      opacity: .8;
      transform: rotate(140deg);
      transform-origin: right center;
      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(22,115,168,.15),
          rgba(22,115,168,.95)
        );
      animation: aparecer-fugaz 11s ease-in-out infinite;
    }

    .fugaz::after {
      content: "✦";
      position: absolute;
      right: -6px;
      top: -9px;
      color: var(--azul);
      font-size: 18px;
    }

    @keyframes aparecer-fugaz {
      0%, 65%, 100% {
        opacity: 0;
        transform:
          translate(-40px, -25px)
          rotate(140deg);
      }

      70% {
        opacity: .9;
      }

      82% {
        opacity: .9;
        transform:
          translate(35px, 30px)
          rotate(140deg);
      }

      87% {
        opacity: 0;
      }
    }

    /*
      CONTENIDO
    */

    .contenedor {
      position: relative;
      z-index: 2;
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 36px 20px 50px;
    }

    /*
      TÍTULO CURVO
    */

    .hero {
      text-align: center;
      padding-top: 8px;
    }

    .titulo-curvo {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 0;
      margin: 0 auto;
      color: var(--azul-oscuro);
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(35px, 8.3vw, 58px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2.4px;
      white-space: nowrap;
      text-shadow:
        0 2px 0 rgba(255,255,255,.5),
        0 5px 12px rgba(18,63,99,.08);
    }

    .titulo-curvo span {
      display: inline-block;
    }

    /*
      Curvatura hacia abajo:
      los extremos quedan más altos
      y el centro baja ligeramente
    */

    .titulo-curvo span:nth-child(1) {
      transform: translateY(0px) rotate(-7deg);
    }

    .titulo-curvo span:nth-child(2) {
      transform: translateY(4px) rotate(-5deg);
    }

    .titulo-curvo span:nth-child(3) {
      transform: translateY(7px) rotate(-3deg);
    }

    .titulo-curvo span:nth-child(4) {
      transform: translateY(10px) rotate(-1deg);
    }

    .titulo-curvo span:nth-child(5) {
      transform: translateY(11px);
    }

    .titulo-curvo span:nth-child(6) {
      transform: translateY(11px);
    }

    .titulo-curvo span:nth-child(7) {
      transform: translateY(11px);
    }

    .titulo-curvo span:nth-child(8) {
      transform: translateY(10px) rotate(1deg);
    }

    .titulo-curvo span:nth-child(9) {
      transform: translateY(7px) rotate(3deg);
    }

    .titulo-curvo span:nth-child(10) {
      transform: translateY(4px) rotate(5deg);
    }

    .titulo-curvo span:nth-child(11) {
      transform: translateY(0px) rotate(7deg);
    }

    .titulo-curvo .espacio {
      width: .23em;
    }

    .subtitulo {
      margin: 24px 0 0;
      color: var(--marron);
      font-size: 17px;
      font-weight: 800;
    }

    .separador {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      margin: 17px auto 12px;
      color: var(--azul);
      font-size: 14px;
    }

    .separador::before,
    .separador::after {
      content: "";
      width: 55px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--azul)
      );
      opacity: .65;
    }

    .separador::after {
      transform: scaleX(-1);
    }

    /*
      LOLO
    */

    .lolo-wrap {
      position: relative;
      width: min(100%, 205px);
      margin: 0 auto;
      z-index: 3;
    }

    .lolo {
      display: block;
      width: 100%;
      height: auto;
      filter:
        drop-shadow(
          0 13px 11px rgba(78,48,26,.18)
        );
    }

    /*
      BARRACAS VALENCIANAS
    */

    .paisaje {
      position: absolute;
      left: 0;
      right: 0;
      top: 275px;
      height: 230px;
      pointer-events: none;
      z-index: 1;
    }

    .barraca {
      position: absolute;
      bottom: 22px;
      width: 92px;
      height: 48px;
      opacity: .45;
    }

    .barraca .casa {
      position: absolute;
      left: 9px;
      bottom: 0;
      width: 74px;
      height: 45px;
      border: 1.5px solid var(--dorado);
      border-top: none;
      border-radius: 1px;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 11px,
          rgba(201,154,81,.23) 12px,
          transparent 13px
        );
    }

    .barraca .techo {
      position: absolute;
      left: 4px;
      top: -21px;
      width: 84px;
      height: 84px;
      border-top: 1.5px solid var(--dorado);
      border-left: 1.5px solid var(--dorado);
      transform: rotate(45deg);
    }

    .barraca .puerta {
      position: absolute;
      bottom: 0;
      left: 36px;
      width: 17px;
      height: 27px;
      border: 1.5px solid var(--dorado);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }

    .barraca .ventana {
      position: absolute;
      bottom: 19px;
      width: 9px;
      height: 10px;
      border: 1px solid var(--dorado);
    }

    .barraca .ventana-1 {
      left: 19px;
    }

    .barraca .ventana-2 {
      right: 18px;
    }

    .barraca.izquierda {
      left: -18px;
      transform: scale(.92);
    }

    .barraca.derecha {
      right: -22px;
      bottom: 5px;
      transform: scale(.72);
      opacity: .36;
    }

    /*
      HIERBAS
    */

    .hierbas {
      position: absolute;
      bottom: 0;
      width: 125px;
      height: 90px;
      opacity: .5;
    }

    .hierbas::before,
    .hierbas::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 2px;
      height: 74px;
      background: var(--verde);
      transform-origin: bottom;
      box-shadow:
        10px -7px 0 -0.5px var(--verde),
        21px 2px 0 -0.5px var(--verde),
        34px -15px 0 -0.5px var(--verde),
        48px -3px 0 -0.5px var(--verde),
        64px -22px 0 -0.5px var(--verde),
        78px -5px 0 -0.5px var(--verde),
        94px -17px 0 -0.5px var(--verde);
    }

    .hierbas::before {
      transform: rotate(-14deg);
    }

    .hierbas::after {
      transform: rotate(14deg);
      left: 18px;
      opacity: .75;
    }

    .hierbas.izquierda {
      left: -15px;
    }

    .hierbas.derecha {
      right: -30px;
      transform: scaleX(-1);
    }

    /*
      CANCIONES
    */

    .canciones {
      position: relative;
      z-index: 4;
      margin-top: 12px;
    }

    .titulo-seccion {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
      margin-bottom: 16px;
    }

    .titulo-seccion::before,
    .titulo-seccion::after {
      content: "";
      width: 54px;
      border-top: 1px dotted rgba(18,63,99,.65);
    }

    .titulo-seccion span {
      color: var(--azul-oscuro);
      font-family: "Space Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.8px;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cancion {
      display: flex;
      align-items: center;
      min-height: 70px;
      padding: 14px 17px;
      text-decoration: none;
      color: var(--texto);

      background:
        linear-gradient(
          120deg,
          rgba(255,252,245,.88),
          rgba(255,248,235,.65)
        );

      border: 1px solid rgba(18,63,99,.16);
      border-radius: 16px;

      box-shadow:
        0 4px 0 rgba(18,63,99,.05),
        0 8px 20px rgba(86,58,36,.06);

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .cancion:hover {
      transform: translateY(-2px);
      background: rgba(255,253,248,.95);

      box-shadow:
        0 5px 0 rgba(18,63,99,.06),
        0 12px 24px rgba(18,63,99,.11);
    }

    .cancion:active {
      transform: scale(.985);
    }

    .numero {
      flex: 0 0 42px;
      color: var(--azul);
      font-family: "Space Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .nombre-cancion {
      flex: 1;
      padding-right: 10px;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 900;
    }

    .flecha {
      flex: 0 0 22px;
      color: var(--azul);
      font-size: 27px;
      line-height: 1;
      text-align: right;
    }

    /*
      FOOTER
    */

    footer {
      position: relative;
      z-index: 3;
      margin-top: 42px;
      text-align: center;
      color: rgba(105,69,46,.72);
      font-size: 13px;
      font-weight: 800;
    }

    footer span {
      margin: 0 8px;
      color: var(--azul);
    }

    /*
      MÓVIL
    */

    @media (max-width: 480px) {

      .contenedor {
        padding:
          28px 16px
          46px;
      }

      .titulo-curvo {
        font-size: 9vw;
        letter-spacing: -1.8px;
      }

      .subtitulo {
        margin-top: 22px;
        font-size: 16px;
      }

      .lolo-wrap {
        width: 190px;
      }

      .paisaje {
        top: 255px;
      }

      .barraca.izquierda {
        left: -39px;
        transform: scale(.78);
      }

      .barraca.derecha {
        right: -42px;
        transform: scale(.61);
      }

      .hierbas.izquierda {
        left: -55px;
        transform: scale(.8);
      }

      .hierbas.derecha {
        right: -65px;
        transform:
          scaleX(-1)
          scale(.8);
      }

      .nombre-cancion {
        font-size: 16px;
      }

      .orbita {
        width: 180vw;
        height: 65vw;
        left: -45vw;
      }

      .orbita-2 {
        width: 160vw;
        height: 58vw;
      }

      .fugaz {
        top: 125px;
        right: -25px;
      }
    }

  </style>
</head>

<body>

  <div class="pagina">

    <div class="textura"></div>
    <div class="textura-lineas"></div>

    <div class="universo">

      <div class="orbita"></div>
      <div class="orbita-2"></div>
      <div class="orbita-3"></div>

      <div class="estrella estrella-1">✦</div>
      <div class="estrella estrella-2">✦</div>
      <div class="estrella estrella-3">✦</div>
      <div class="estrella estrella-4">✦</div>
      <div class="estrella estrella-5">✦</div>
      <div class="estrella estrella-6">✦</div>

      <div class="fugaz"></div>

    </div>

    <main class="contenedor">

      <section class="hero">

        <h1 class="titulo-curvo">

          <span>L</span>
          <span>o</span>
          <span>l</span>
          <span>o</span>

          <span class="espacio"></span>

          <span>y</span>

          <span class="espacio"></span>

          <span>l</span>
          <span>a</span>

          <span class="espacio"></span>

          <span>Y</span>
          <span>a</span>
          <span>y</span>
          <span>a</span>

        </h1>

        <p class="subtitulo">
          La música de Lolo y la Yaya
        </p>

        <div class="separador">
          ✦
        </div>

        <div class="lolo-wrap">
          <img
            class="lolo"
            src="lolo.png"
            alt="Lolo, héroe intergaláctico"
          >
        </div>

      </section>


      <div class="paisaje">

        <div class="barraca izquierda">

          <div class="casa"></div>
          <div class="techo"></div>
          <div class="puerta"></div>

          <div class="ventana ventana-1"></div>
          <div class="ventana ventana-2"></div>

        </div>


        <div class="barraca derecha">

          <div class="casa"></div>
          <div class="techo"></div>
          <div class="puerta"></div>

          <div class="ventana ventana-1"></div>
          <div class="ventana ventana-2"></div>

        </div>


        <div class="hierbas izquierda"></div>
        <div class="hierbas derecha"></div>

      </div>


      <section class="canciones">

        <div class="titulo-seccion">
          <span>LAS CANCIONES</span>
        </div>


        <div class="lista">

          <a
            class="cancion"
            href="/por-si-algun-dia/"
          >
            <span class="numero">01</span>

            <span class="nombre-cancion">
              Por si algún día
            </span>

            <span class="flecha">›</span>
          </a>


          <a
            class="cancion"
            href="/no-me-aplastes-soy-un-heroe/"
          >
            <span class="numero">02</span>

            <span class="nombre-cancion">
              No me aplastes, soy un héroe
            </span>

            <span class="flecha">›</span>
          </a>


          <a
            class="cancion"
            href="/basura-con-estilo/"
          >
            <span class="numero">03</span>

            <span class="nombre-cancion">
              Basura con estilo
            </span>

            <span class="flecha">›</span>
          </a>


          <a
            class="cancion"
            href="/molestar-por-la-noche-dormir-todo-el-dia/"
          >
            <span class="numero">04</span>

            <span class="nombre-cancion">
              Molestar por la noche,
              dormir todo el día
            </span>

            <span class="flecha">›</span>
          </a>


          <a
            class="cancion"
            href="/una-espia-intergalactica/"
          >
            <span class="numero">05</span>

            <span class="nombre-cancion">
              Una espía intergaláctica
            </span>

            <span class="flecha">›</span>
          </a>


          <a
            class="cancion"
            href="/la-leyenda-de-lolo-y-la-yaya/"
          >
            <span class="numero">06</span>

            <span class="nombre-cancion">
              La leyenda de Lolo y la Yaya
            </span>

            <span class="flecha">›</span>
          </a>

        </div>

      </section>


      <footer>
        <span>✦</span>
        Lolo y la Yaya
        <span>✦</span>
      </footer>

    </main>

  </div>

</body>
</html>
