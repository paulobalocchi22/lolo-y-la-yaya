<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#f5e7c7">

  <title>Lolo y la Yaya | La música</title>

  <style>
    /* =====================================================
       BASE
    ====================================================== */

    :root {
      --cream: #f5e7c7;
      --cream-light: #fff6df;
      --blue: #173f70;
      --blue-soft: #2e5f91;
      --brown: #4c3929;
      --gold: #c99745;
      --line: rgba(38, 68, 94, .18);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f5e7c7 !important;
      color-scheme: light only;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(255,255,255,.82) 0%,
          rgba(255,248,228,.38) 24%,
          rgba(245,231,199,.45) 58%,
          rgba(232,209,163,.55) 100%
        ),
        #f5e7c7 !important;

      color: var(--brown);

      font-family:
        "Trebuchet MS",
        "Avenir Next",
        Arial,
        sans-serif;

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fuerza fondo claro incluso en navegadores Android
       que intentan aplicar modo oscuro */

    @media (prefers-color-scheme: dark) {
      html,
      body {
        background: #f5e7c7 !important;
        color: #4c3929 !important;
      }
    }


    /* =====================================================
       FONDO GENERAL
    ====================================================== */

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at center top,
          rgba(255,255,255,.78) 0%,
          rgba(255,248,226,.20) 34%,
          transparent 70%
        ),
        #f5e7c7 !important;
    }

    /* Textura muy sutil */

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -3;

      opacity: .34;

      background-image:
        radial-gradient(
          rgba(88,65,35,.18) .7px,
          transparent .8px
        ),
        radial-gradient(
          rgba(255,255,255,.8) .8px,
          transparent .9px
        );

      background-size:
        21px 21px,
        31px 31px;

      background-position:
        0 0,
        11px 8px;
    }

    /* Arcos decorativos */

    .orbit {
      position: absolute;
      pointer-events: none;
      z-index: 0;

      border: 1px dotted rgba(41, 75, 108, .27);
      border-radius: 50%;
    }

    .orbit.one {
      width: min(110vw, 1400px);
      height: 500px;

      left: 50%;
      top: -240px;

      transform: translateX(-50%);
    }

    .orbit.two {
      width: min(130vw, 1600px);
      height: 720px;

      left: 50%;
      bottom: -530px;

      transform: translateX(-50%);
    }


    /* =====================================================
       ESTRELLAS
    ====================================================== */

    .star {
      position: absolute;
      z-index: 1;
      pointer-events: none;

      width: 8px;
      height: 8px;

      transform: rotate(45deg);

      background: var(--blue);

      opacity: .8;

      animation: twinkle 4s ease-in-out infinite;
    }

    .star::before,
    .star::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
      background: inherit;
    }

    .star::before {
      width: 2px;
      height: 18px;
      border-radius: 10px;
    }

    .star::after {
      width: 18px;
      height: 2px;
      border-radius: 10px;
    }

    .star.gold {
      background: #b98a3d;
    }

    .star.white {
      background: rgba(255,255,255,.95);
      filter: drop-shadow(0 0 8px rgba(255,255,255,.9));
    }

    .star.big {
      width: 12px;
      height: 12px;
    }

    .star.small {
      width: 4px;
      height: 4px;
    }

    .s1  { top: 8%;  left: 6%;  animation-delay: 0s; }
    .s2  { top: 13%; right: 10%; animation-delay: 1.2s; }
    .s3  { top: 26%; left: 9%; animation-delay: 2.4s; }
    .s4  { top: 38%; right: 7%; animation-delay: .6s; }
    .s5  { top: 49%; left: 4%; animation-delay: 1.7s; }
    .s6  { top: 61%; right: 11%; animation-delay: 3s; }
    .s7  { top: 73%; left: 8%; animation-delay: .8s; }
    .s8  { top: 86%; right: 6%; animation-delay: 2.1s; }
    .s9  { top: 19%; left: 17%; animation-delay: 2.7s; }
    .s10 { top: 33%; right: 20%; animation-delay: .3s; }
    .s11 { top: 67%; left: 17%; animation-delay: 1.4s; }
    .s12 { top: 91%; left: 30%; animation-delay: 2.9s; }

    @keyframes twinkle {
      0%, 100% {
        opacity: .18;
        transform: rotate(45deg) scale(.65);
        filter: none;
      }

      50% {
        opacity: 1;
        transform: rotate(45deg) scale(1.25);
        filter: drop-shadow(0 0 8px rgba(255,255,255,.8));
      }
    }


    /* =====================================================
       COMETA ESTÁTICO / DECORATIVO
    ====================================================== */

    .comet {
      position: absolute;
      z-index: 1;
      pointer-events: none;

      width: 120px;
      height: 3px;

      border-radius: 50%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(109,161,204,.18),
          rgba(90,148,196,.95),
          rgba(255,255,255,1)
        );

      transform: rotate(-43deg);

      opacity: .85;

      filter:
        drop-shadow(0 0 5px rgba(125,184,226,.7));
    }

    .comet::after {
      content: "";
      position: absolute;

      width: 9px;
      height: 9px;

      right: -3px;
      top: 50%;

      transform: translateY(-50%);

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 12px 4px rgba(255,255,255,.9);
    }

    .comet.top {
      top: 7%;
      right: 12%;
    }

    .comet.bottom {
      bottom: 4%;
      left: 4%;

      transform: rotate(-43deg) scale(.75);

      opacity: .6;
    }


    /* =====================================================
       CONTENEDOR
    ====================================================== */

    .content {
      position: relative;
      z-index: 2;

      width: min(100%, 1000px);
      margin: 0 auto;

      padding:
        clamp(36px, 6vw, 80px)
        24px
        50px;
    }


    /* =====================================================
       CABECERA
    ====================================================== */

    .hero {
      position: relative;
      text-align: center;

      padding-bottom: 8px;
    }

    .logo-arc {
      display: block;

      width: min(92vw, 650px);
      height: auto;

      margin:
        0 auto
        2px;
    }

    .logo-arc text {
      fill: var(--blue);

      font-family:
        "Trebuchet MS",
        "Arial Rounded MT Bold",
        Arial,
        sans-serif;

      font-size: 75px;
      font-weight: 900;

      letter-spacing: 2px;

      stroke: rgba(23,63,112,.15);
      stroke-width: 1px;

      paint-order: stroke fill;

      filter:
        drop-shadow(0 2px 1px rgba(255,255,255,.6));
    }

    .logo-arc textPath {
      animation: titleGlow 6s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 82%, 100% {
        filter: none;
      }

      88%, 94% {
        filter:
          drop-shadow(0 0 2px white)
          drop-shadow(0 0 7px rgba(255,255,255,.95))
          drop-shadow(0 0 10px rgba(72,133,185,.45));
      }
    }

    .subtitle {
      margin: 0;

      color: #594638;

      font-size: clamp(17px, 2.6vw, 25px);
      font-weight: 500;

      letter-spacing: .4px;
    }


    /* =====================================================
       SEPARADOR
    ====================================================== */

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;

      width: 100%;
      max-width: 310px;

      margin:
        24px auto
        0;
    }

    .divider::before,
    .divider::after {
      content: "";

      width: 90px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(23,63,112,.55)
        );
    }

    .divider::after {
      transform: rotate(180deg);
    }

    .divider .star {
      position: relative;
      inset: auto;

      flex: 0 0 auto;

      animation-delay: 1.4s;
    }


    /* =====================================================
       LOLO
    ====================================================== */

    .lolo-stage {
      position: relative;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      min-height: clamp(390px, 48vw, 560px);

      margin-top: 8px;
    }

    .lolo-stage::after {
      content: "";

      position: absolute;

      width: min(420px, 75vw);
      height: 34px;

      bottom: 5px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,
          rgba(79,53,25,.20),
          transparent 68%
        );

      filter: blur(5px);
    }

    .lolo {
      position: relative;
      z-index: 2;

      display: block;

      width: min(430px, 78vw);
      max-height: 530px;

      object-fit: contain;

      filter:
        drop-shadow(0 14px 10px rgba(62,42,20,.16));

      transform-origin: center bottom;

      animation: loloFloat 6s ease-in-out infinite;
    }

    @keyframes loloFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }


    /* =====================================================
       BARRACAS
    ====================================================== */

    .house {
      position: absolute;
      z-index: 1;

      width: clamp(120px, 17vw, 210px);

      opacity: .58;

      filter:
        saturate(.8)
        drop-shadow(0 4px 5px rgba(80,55,30,.08));
    }

    .house.left {
      left: clamp(-15px, 1vw, 50px);
      bottom: 44px;
    }

    .house.right {
      right: clamp(-15px, 1vw, 50px);
      bottom: 48px;

      transform: scaleX(-1);
    }


    /* =====================================================
       HIERBAS
    ====================================================== */

    .grass {
      position: absolute;
      z-index: 2;

      width: clamp(75px, 10vw, 145px);

      opacity: .63;

      transform-origin: bottom center;
    }

    .grass.one {
      left: clamp(4px, 7vw, 100px);
      bottom: 25px;

      transform: rotate(-4deg);
    }

    .grass.two {
      left: clamp(15px, 17vw, 210px);
      bottom: 18px;

      transform: scale(.7) rotate(5deg);
    }

    .grass.three {
      right: clamp(4px, 7vw, 100px);
      bottom: 24px;

      transform: scaleX(-1) rotate(-4deg);
    }

    .grass.four {
      right: clamp(15px, 17vw, 210px);
      bottom: 17px;

      transform: scaleX(-1) scale(.7) rotate(5deg);
    }


    /* =====================================================
       SECCIÓN CANCIONES
    ====================================================== */

    .songs {
      position: relative;
      z-index: 5;

      max-width: 700px;

      margin:
        12px auto
        0;
    }

    .songs-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;

      margin:
        0
        0
        24px;

      color: var(--blue);

      font-size: clamp(17px, 2.3vw, 23px);
      font-weight: 700;

      letter-spacing: 5px;
    }

    .songs-title::before,
    .songs-title::after {
      content: "";

      width: clamp(45px, 9vw, 100px);

      border-top:
        1px dotted rgba(23,63,112,.65);
    }


    /* =====================================================
       LISTA
    ====================================================== */

    .song-list {
      display: grid;
      gap: 10px;

      margin: 0;
      padding: 0;

      list-style: none;
    }

    .song-card {
      position: relative;

      display: flex;
      align-items: center;

      min-height: 78px;

      padding: 14px 20px;

      border:
        1px solid rgba(141,105,56,.23);

      border-radius: 17px;

      background:
        linear-gradient(
          120deg,
          rgba(255,252,241,.72),
          rgba(255,246,224,.42)
        );

      box-shadow:
        0 5px 15px rgba(99,72,36,.05),
        inset 0 1px 0 rgba(255,255,255,.65);

      backdrop-filter: blur(3px);

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
    }

    .song-card:hover {
      transform: translateY(-3px);

      border-color: rgba(23,63,112,.28);

      box-shadow:
        0 10px 25px rgba(66,54,35,.11),
        inset 0 1px 0 rgba(255,255,255,.75);
    }

    .song-card:active {
      transform: scale(.985);
    }

    .song-link {
      display: flex;
      align-items: center;

      width: 100%;
      min-height: 50px;

      color: inherit;
      text-decoration: none;
    }

    .song-number {
      flex: 0 0 60px;

      color: var(--blue);

      font-size: 16px;
      font-weight: 500;

      letter-spacing: 1px;
    }

    .song-name {
      flex: 1;

      padding-right: 12px;

      font-size: clamp(17px, 2vw, 21px);
      font-weight: 500;

      line-height: 1.25;
    }

    .arrow {
      flex: 0 0 auto;

      color: var(--blue);

      font-size: 35px;
      font-weight: 300;

      line-height: 1;

      transition:
        transform .25s ease;
    }

    .song-card:hover .arrow {
      transform: translateX(4px);
    }


    /* =====================================================
       PIE
    ====================================================== */

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      margin-top: 38px;

      color: #594638;

      font-size: 16px;

      letter-spacing: .5px;
    }

    .footer-star {
      color: var(--blue);
      font-size: 18px;
    }


    /* =====================================================
       MÓVIL
    ====================================================== */

    @media (max-width: 700px) {

      .content {
        padding:
          30px 18px
          calc(38px + env(safe-area-inset-bottom));
      }

      .hero {
        padding-top: 0;
      }

      .logo-arc {
        width: min(98vw, 570px);
      }

      .logo-arc text {
        font-size: 61px;
        letter-spacing: 1px;
      }

      .subtitle {
        margin-top: -2px;
        font-size: 17px;
      }

      .divider {
        margin-top: 19px;
      }

      .lolo-stage {
        min-height: 390px;
        margin-top: 4px;
      }

      .lolo {
        width: min(365px, 80vw);
        max-height: 410px;
      }

      .house {
        width: 112px;
        opacity: .46;
      }

      .house.left {
        left: -22px;
        bottom: 36px;
      }

      .house.right {
        right: -22px;
        bottom: 38px;
      }

      .grass {
        width: 70px;
        opacity: .58;
      }

      .grass.one {
        left: -5px;
        bottom: 18px;
      }

      .grass.two {
        left: 47px;
        bottom: 16px;
      }

      .grass.three {
        right: -5px;
        bottom: 17px;
      }

      .grass.four {
        right: 47px;
        bottom: 15px;
      }

      .songs {
        margin-top: 5px;
      }

      .songs-title {
        gap: 10px;
        margin-bottom: 18px;

        font-size: 16px;
        letter-spacing: 3px;
      }

      .song-list {
        gap: 7px;
      }

      .song-card {
        min-height: 72px;

        padding:
          9px 15px;

        border-radius: 16px;
      }

      .song-number {
        flex-basis: 47px;

        font-size: 14px;
      }

      .song-name {
        font-size: 17px;
      }

      .arrow {
        font-size: 30px;
      }

      .comet.top {
        width: 85px;
        top: 7%;
        right: -3%;
      }

      .comet.bottom {
        width: 70px;
      }

      .orbit.one {
        width: 150vw;
      }

      .orbit.two {
        width: 180vw;
      }
    }


    /* Móviles pequeños */

    @media (max-width: 390px) {

      .logo-arc text {
        font-size: 54px;
      }

      .lolo-stage {
        min-height: 355px;
      }

      .lolo {
        width: 315px;
      }

      .song-name {
        font-size: 16px;
      }
    }

  </style>
</head>


<body>

  <main class="page">

    <!-- ÓRBITAS DECORATIVAS -->

    <div class="orbit one"></div>
    <div class="orbit two"></div>


    <!-- ESTRELLAS -->

    <span class="star big s1"></span>
    <span class="star gold small s2"></span>
    <span class="star s3"></span>
    <span class="star white small s4"></span>
    <span class="star gold s5"></span>
    <span class="star big s6"></span>
    <span class="star white s7"></span>
    <span class="star gold small s8"></span>
    <span class="star small s9"></span>
    <span class="star gold s10"></span>
    <span class="star white small s11"></span>
    <span class="star s12"></span>


    <!-- COMETAS DECORATIVOS -->

    <div class="comet top"></div>
    <div class="comet bottom"></div>


    <div class="content">


      <!-- =================================================
           CABECERA
      ================================================== -->

      <header class="hero">

        <svg
          class="logo-arc"
          viewBox="0 0 800 180"
          role="img"
          aria-label="Lolo y la Yaya"
        >

          <defs>

            <!-- Arco hacia abajo -->

            <path
              id="titleArc"
              d="M 90 45 Q 400 170 710 45"
              fill="none"
            />

          </defs>

          <text>
            <textPath
              href="#titleArc"
              startOffset="50%"
              text-anchor="middle"
            >
              LOLO Y LA YAYA
            </textPath>
          </text>

        </svg>


        <p class="subtitle">
          La música de Lolo y la Yaya
        </p>


        <div class="divider">

          <span class="star"></span>

        </div>

      </header>



      <!-- =================================================
           LOLO + PAISAJE
      ================================================== -->

      <section
        class="lolo-stage"
        aria-label="Lolo"
      >

        <img
          src="House.png"
          alt=""
          class="house left"
        >

        <img
          src="House.png"
          alt=""
          class="house right"
        >


        <img
          src="hierba.png"
          alt=""
          class="grass one"
        >

        <img
          src="hierba.png"
          alt=""
          class="grass two"
        >

        <img
          src="hierba.png"
          alt=""
          class="grass three"
        >

        <img
          src="hierba.png"
          alt=""
          class="grass four"
        >


        <img
          src="lolo.png"
          alt="Lolo, el héroe de la historia"
          class="lolo"
        >

      </section>



      <!-- =================================================
           CANCIONES
      ================================================== -->

      <section
        class="songs"
        aria-labelledby="songs-title"
      >

        <h2
          class="songs-title"
          id="songs-title"
        >
          LAS CANCIONES
        </h2>


        <ol class="song-list">


          <li class="song-card">

            <a
              class="song-link"
              href="por-si-algun-dia.html"
            >

              <span class="song-number">
                01
              </span>

              <span class="song-name">
                Por si algún día
              </span>

              <span class="arrow">
                ›
              </span>

            </a>

          </li>


          <li class="song-card">

            <a
              class="song-link"
              href="no-me-aplastes-soy-un-heroe.html"
            >

              <span class="song-number">
                02
              </span>

              <span class="song-name">
                No me aplastes, soy un héroe
              </span>

              <span class="arrow">
                ›
              </span>

            </a>

          </li>


          <li class="song-card">

            <a
              class="song-link"
              href="basura-con-estilo.html"
            >

              <span class="song-number">
                03
              </span>

              <span class="song-name">
                Basura con estilo
              </span>

              <span class="arrow">
                ›
              </span>

            </a>

          </li>


          <li class="song-card">

            <a
              class="song-link"
              href="molestar-por-la-noche.html"
            >

              <span class="song-number">
                04
              </span>

              <span class="song-name">
                Molestar por la noche,
                dormir todo el día
              </span>

              <span class="arrow">
                ›
              </span>

            </a>

          </li>


          <li class="song-card">

            <a
              class="song-link"
              href="una-espia-intergalactica.html"
            >

              <span class="song-number">
                05
              </span>

              <span class="song-name">
                Una espía intergaláctica
              </span>

              <span class="arrow">
                ›
              </span>

            </a>

          </li>


          <li class="song-card">

            <a
              class="song-link"
              href="la-leyenda-de-lolo-y-la-yaya.html"
            >

              <span class="song-number">
                06
              </span>

              <span class="song-name">
                La leyenda de Lolo y la Yaya
              </span>

              <span class="arrow">
                ›
              </span>

            </a>

          </li>


        </ol>

      </section>


      <!-- =================================================
           PIE
      ================================================== -->

      <footer class="footer">

        <span class="footer-star">✦</span>

        <span>Lolo y la Yaya</span>

        <span class="footer-star">✦</span>

      </footer>


    </div>

  </main>

</body>
</html>
