<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- Importante para móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Lolo y la Yaya | La música</title>

  <meta name="description" content="La música de Lolo y la Yaya">

  <style>
    /*
      FORZAMOS EL MODO CLARO.

      Esto evita que algunos navegadores Android intenten
      convertir el fondo crema en negro automáticamente.
    */
    :root {
      color-scheme: light only;
      background: #f6ecd4;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #f6ecd4 !important;
      color-scheme: light !important;
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;

      background: #f6ecd4 !important;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      -webkit-text-size-adjust: 100%;
    }

    /*
      CONTENEDOR PRINCIPAL

      La imagen mantiene siempre sus proporciones originales.
    */
    .site {
      position: relative;
      width: 100%;
      max-width: 653px;

      margin: 0 auto;

      line-height: 0;
      overflow: hidden;

      background: #f6ecd4;
    }

    /*
      IMAGEN DE ESCRITORIO
    */
    .desktop-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      IMAGEN MÓVIL

      Oculta por defecto.
    */
    .mobile-image {
      display: none;
      width: 100%;
      height: auto;
    }

    /*
      ENLACES DE LAS CANCIONES

      Son zonas transparentes situadas exactamente
      sobre las tarjetas de la ilustración.
    */
    .song-link {
      position: absolute;
      z-index: 10;

      display: block;

      border-radius: 18px;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
    }

    /*
      Pequeño efecto profesional al tocar/pasar por una canción.
      No modifica el diseño visual original.
    */
    .song-link:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .song-link:active {
      background: rgba(20, 58, 100, 0.08);
    }


    /* =========================================
       POSICIONES - VERSIÓN ESCRITORIO
       ========================================= */

    .song-1 {
      left: 14%;
      width: 72%;
      top: 65.2%;
      height: 4.8%;
    }

    .song-2 {
      left: 14%;
      width: 72%;
      top: 70.1%;
      height: 4.8%;
    }

    .song-3 {
      left: 14%;
      width: 72%;
      top: 75%;
      height: 4.8%;
    }

    .song-4 {
      left: 14%;
      width: 72%;
      top: 79.9%;
      height: 5.5%;
    }

    .song-5 {
      left: 14%;
      width: 72%;
      top: 85.4%;
      height: 4.8%;
    }

    .song-6 {
      left: 14%;
      width: 72%;
      top: 90.3%;
      height: 4.8%;
    }


    /* =========================================
       VERSIÓN MÓVIL
       ========================================= */

    @media (max-width: 700px) {

      body {
        width: 100%;
        overflow-x: hidden;
        background: #f6ecd4 !important;
      }

      .site {
        width: 100%;
        max-width: 430px;
        background: #f6ecd4 !important;
      }

      .desktop-image {
        display: none;
      }

      .mobile-image {
        display: block;
        width: 100%;
        height: auto;
      }


      /*
        Reposicionamos los enlaces sobre las tarjetas
        de la versión vertical.
      */

      .song-1 {
        left: 3%;
        width: 94%;
        top: 63.7%;
        height: 5.4%;
      }

      .song-2 {
        left: 3%;
        width: 94%;
        top: 69.2%;
        height: 5.4%;
      }

      .song-3 {
        left: 3%;
        width: 94%;
        top: 74.7%;
        height: 5.4%;
      }

      .song-4 {
        left: 3%;
        width: 94%;
        top: 80.2%;
        height: 5.4%;
      }

      .song-5 {
        left: 3%;
        width: 94%;
        top: 85.7%;
        height: 5.4%;
      }

      .song-6 {
        left: 3%;
        width: 94%;
        top: 91.2%;
        height: 5.4%;
      }

    }

  </style>
</head>


<body>

  <main class="site">

    <!--
      IMAGEN PARA ORDENADOR
    -->
    <img
      src="lolo-home-desktop.png"
      alt="Lolo y la Yaya - La música"
      class="desktop-image"
    >


    <!--
      IMAGEN PARA MÓVIL
    -->
    <img
      src="lolo-home-mobile.png"
      alt="Lolo y la Yaya - La música"
      class="mobile-image"
    >


    <!--
      ==================================================
      ENLACES DE LAS CANCIONES
      ==================================================

      De momento llevan a "#" porque las páginas todavía
      no existen.

      Más adelante cambiaremos cada href por su URL definitiva.
    -->


    <!-- 01 -->
    <a
      href="#"
      class="song-link song-1"
      aria-label="Por si algún día"
    ></a>


    <!-- 02 -->
    <a
      href="#"
      class="song-link song-2"
      aria-label="No me aplastes, soy un héroe"
    ></a>


    <!-- 03 -->
    <a
      href="#"
      class="song-link song-3"
      aria-label="Basura con estilo"
    ></a>


    <!-- 04 -->
    <a
      href="#"
      class="song-link song-4"
      aria-label="Molestar por la noche, dormir todo el día"
    ></a>


    <!-- 05 -->
    <a
      href="#"
      class="song-link song-5"
      aria-label="Una espía intergaláctica"
    ></a>


    <!-- 06 -->
    <a
      href="#"
      class="song-link song-6"
      aria-label="La leyenda de Lolo y la Yaya"
    ></a>


  </main>

</body>
</html>
