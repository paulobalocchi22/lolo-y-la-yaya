<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#f7efd9">
  <meta name="color-scheme" content="light">

  <title>Lolo y la Yaya | La música</title>

  <style>
    /* =========================
       RESET Y BASE
    ========================== */

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f7efd9 !important;
      color-scheme: light !important;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background: #f7efd9 !important;
      color: #263d5a;
      font-family:
        "Trebuchet MS",
        "Avenir Next",
        "Segoe UI",
        Arial,
        sans-serif;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       FONDO GENERAL
    ========================== */

    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 32%,
          rgba(255, 255, 255, 0.78) 0,
          rgba(255, 255, 255, 0.28) 25%,
          transparent 52%
        ),
        radial-gradient(
          circle at 12% 10%,
          rgba(255, 224, 145, 0.20),
          transparent 30%
        ),
        radial-gradient(
          circle at 88% 88%,
          rgba(255, 218, 120, 0.18),
          transparent 28%
        ),
        #f7efd9;
    }

    /* textura muy sutil */

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.22;

      background-image:
        radial-gradient(
          circle,
          rgba(38, 61, 90, 0.18) 0.7px,
          transparent 0.8px
        );

      background-size: 23px 23px;
    }

    /* líneas decorativas */

    .line {
      position: absolute;
      height: 1px;
      width: 46vw;
      opacity: 0.13;
      background: #355779;
      transform-origin: left center;
      pointer-events: none;
    }

    .line.one {
      top: 18%;
      left: -8%;
      transform: rotate(-15deg);
    }

    .line.two {
      top: 9%;
      right: -15%;
      transform: rotate(4deg);
    }

    .line.three {
      bottom: 23%;
      left: -10%;
      transform: rotate(12deg);
    }

    .line.four {
      bottom: 10%;
      right: -10%;
      transform: rotate(-18deg);
    }

    /* =========================
       ESTRELLAS Y DESTELLOS
    ========================== */

    .star {
      position: absolute;
      z-index: 0;
      color: #315a80;
      pointer-events: none;
      transform-origin: center;
    }

    .star.cross {
      width: 18px;
      height: 18px;
      opacity: 0.75;
    }

    .star.cross::before,
    .star.cross::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: currentColor;
      transform: translate(-50%, -50%);
      border-radius: 100px;
    }

    .star.cross::before {
      width: 2px;
      height: 100%;
    }

    .star.cross::after {
      width: 100%;
      height: 2px;
    }

    .star.cross.small {
      width: 9px;
      height: 9px;
    }

    .star.cross.gold {
      color: #c8953e;
    }

    .star.diamond {
      width: 10px;
      height: 10px;
      background: currentColor;
      transform: rotate(45deg);
      opacity: 0.75;
    }

    .star.dot {
      width: 4px;
      height: 4px;
      background: currentColor;
      border-radius: 50%;
      opacity: 0.55;
    }

    .twinkle {
      animation: twinkle 4.5s ease-in-out infinite;
    }

    .twinkle.delay-1 {
      animation-delay: 1.2s;
    }

    .twinkle.delay-2 {
      animation-delay: 2.6s;
    }

    .twinkle.delay-3 {
      animation-delay: 3.4s;
    }

    .twinkle.slow {
      animation-duration: 6.5s;
    }

    @keyframes twinkle {
      0%,
      100% {
        opacity: 0.28;
        transform: scale(0.75);
        filter: drop-shadow(0 0 0 transparent);
      }

      45% {
        opacity: 0.45;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1.45);
        filter:
          drop-shadow(0 0 4px rgba(255, 255, 255, 0.95))
          drop-shadow(0 0 8px rgba(67, 104, 145, 0.45));
      }

      58% {
        opacity: 0.6;
        transform: scale(1);
      }
    }

    /* posiciones de estrellas */

    .s1  { top: 7%; left: 8%; }
    .s2  { top: 10%; right: 13%; }
    .s3  { top: 18%; left: 22%; }
    .s4  { top: 24%; right: 7%; }
    .s5  { top: 31%; left: 5%; }
    .s6  { top: 36%; right: 17%; }
    .s7  { top: 44%; left: 13%; }
    .s8  { top: 51%; right: 5%; }
    .s9  { top: 58%; left: 4%; }
    .s10 { top: 66%; right: 13%; }
    .s11 { top: 73%; left: 10%; }
    .s12 { top: 82%; right: 7%; }
    .s13 { top: 90%; left: 18%; }
    .s14 { top: 94%; right: 22%; }
    .s15 { top: 14%; left: 42%; }
    .s16 { top: 28%; left: 72%; }
    .s17 { top: 76%; left: 82%; }
    .s18 { top: 86%; left: 45%; }

    /* =========================
       ESCENOGRAFÍA
    ========================== */

    .scenery {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .house {
      position: absolute;
      width: clamp(135px, 14vw, 235px);
      height: auto;
      opacity: 0.42;
      filter: saturate(0.82);
    }

    .grass {
      position: absolute;
      width: clamp(90px, 9vw, 165px);
      height: auto;
      opacity: 0.43;
      filter: saturate(0.72);
    }

    /*
      En escritorio entran claramente hacia el centro.
      Ya no quedan pegadas a los extremos.
    */

    .house-left {
      left: 8vw;
      top: 38%;
    }

    .grass-left {
      left: 20vw;
      top: 48%;
    }

    .house-right {
      right: 8vw;
      top: 39%;
      transform: scaleX(-1);
    }

    .grass-right {
      right: 20vw;
      top: 49%;
      transform: scaleX(-1);
    }

    /* =========================
       CONTENIDO
    ========================== */

    .content {
      position: relative;
      z-index: 2;
      width: min(100%, 760px);
      margin: 0 auto;
      padding:
        max(38px, env(safe-area-inset-top))
        22px
        max(42px, env(safe-area-inset-bottom));
    }

    /* =========================
       CABECERA
    ========================== */

    header {
      text-align: center;
      position: relative;
      padding-top: 4px;
    }

    .logo-wrap {
      width: min(100%, 670px);
      margin: 0 auto;
    }

    .logo-svg {
      width: 100%;
      height: auto;
      overflow: visible;
      display: block;
    }

    .logo-text {
      font-family:
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        sans-serif;

      font-weight: 900;
      letter-spacing: 0.01em;
      fill: #213f63;

      stroke: rgba(255, 250, 228, 0.75);
      stroke-width: 2px;

      paint-order: stroke fill;

      filter:
        drop-shadow(0 2px 0 rgba(38, 61, 90, 0.08));
    }

    /* brillo suave del título */

    .logo-shine {
      animation: titleGlow 7s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%,
      76%,
      100% {
        filter:
          drop-shadow(0 2px 0 rgba(38, 61, 90, 0.08));
      }

      82% {
        filter:
          drop-shadow(0 0 2px rgba(255, 255, 255, 0.9))
          drop-shadow(0 0 8px rgba(255, 222, 130, 0.8))
          drop-shadow(0 0 16px rgba(255, 255, 255, 0.45));
      }

      87% {
        filter:
          drop-shadow(0 2px 0 rgba(38, 61, 90, 0.08));
      }

      91% {
        filter:
          drop-shadow(0 0 4px rgba(255, 255, 255, 0.85))
          drop-shadow(0 0 10px rgba(255, 214, 120, 0.7));
      }
    }

    .subtitle {
      margin: 4px 0 0;
      color: #584a3c;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 600;
      letter-spacing: 0.015em;
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 22px auto 0;
      color: #315a80;
    }

    .ornament::before,
    .ornament::after {
      content: "";
      width: 55px;
      height: 1px;
      background: rgba(49, 90, 128, 0.55);
    }

    .ornament-star {
      font-size: 18px;
      animation: ornamentGlow 5s ease-in-out infinite;
    }

    @keyframes ornamentGlow {
      0%,
      100% {
        opacity: 0.65;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.25);
        text-shadow:
          0 0 8px rgba(255,255,255,0.9),
          0 0 13px rgba(49,90,128,0.55);
      }
    }

    /* =========================
       LOLO
    ========================== */

    .lolo-area {
      position: relative;
      display: flex;
      justify-content: center;
      margin-top: 22px;
      min-height: 390px;
      align-items: flex-end;
    }

    .lolo {
      position: relative;
      width: clamp(240px, 34vw, 350px);
      height: auto;
      display: block;

      filter:
        drop-shadow(0 15px 22px rgba(52, 66, 74, 0.14));

      z-index: 2;
    }

    /* sombra */

    .lolo-area::after {
      content: "";
      position: absolute;
      bottom: 9px;
      width: 270px;
      height: 25px;
      border-radius: 50%;
      background: rgba(70, 58, 43, 0.10);
      filter: blur(10px);
      z-index: 1;
    }

    /* =========================
       CANCIONES
    ========================== */

    .songs-section {
      margin-top: 14px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;

      margin: 0 0 20px;

      color: #294766;

      font-size: 0.93rem;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      width: 50px;
      height: 1px;
      background: rgba(41, 71, 102, 0.42);
    }

    .songs {
      display: grid;
      gap: 9px;
    }

    .song {
      display: grid;
      grid-template-columns: 50px 1fr 35px;
      align-items: center;

      min-height: 73px;

      padding: 10px 17px;

      border: 1px solid rgba(157, 125, 74, 0.26);
      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.50),
          rgba(255,250,231,0.30)
        );

      box-shadow:
        0 4px 16px rgba(92, 76, 47, 0.055);

      backdrop-filter: blur(4px);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .song:hover {
      transform: translateY(-2px);
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.75),
          rgba(255,246,218,0.48)
        );

      box-shadow:
        0 8px 22px rgba(70, 58, 43, 0.10);
    }

    .song:active {
      transform: scale(0.99);
    }

    .song-number {
      color: #315a80;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .song-title {
      color: #34363a;
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.22;
    }

    .arrow {
      color: #315a80;
      font-size: 2rem;
      font-weight: 300;
      line-height: 1;
      text-align: right;
      transition: transform 0.2s ease;
    }

    .song:hover .arrow {
      transform: translateX(4px);
    }

    /* =========================
       PIE
    ========================== */

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      margin-top: 38px;

      color: #574b3f;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    footer span {
      color: #315a80;
      animation: footerStar 5s ease-in-out infinite;
    }

    @keyframes footerStar {
      0%,
      100% {
        opacity: 0.65;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.4);
        text-shadow: 0 0 9px rgba(49,90,128,0.6);
      }
    }

    /* =========================
       MÓVIL
    ========================== */

    @media (max-width: 600px) {

      html,
      body {
        background: #f7efd9 !important;
      }

      .page {
        min-height: 100vh;
        min-height: 100dvh;
        background:
          radial-gradient(
            circle at 50% 25%,
            rgba(255,255,255,0.75),
            rgba(255,255,255,0.15) 37%,
            transparent 62%
          ),
          radial-gradient(
            circle at 0% 80%,
            rgba(255,221,139,0.20),
            transparent 32%
          ),
          #f7efd9 !important;
      }

      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .logo-wrap {
        width: 100%;
      }

      .subtitle {
        font-size: 1rem;
      }

      .lolo-area {
        min-height: 310px;
        margin-top: 18px;
      }

      .lolo {
        width: min(78vw, 305px);
      }

      /*
        En móvil la escenografía baja,
        para no competir con Lolo.
      */

      .house {
        width: 105px;
        opacity: 0.31;
      }

      .grass {
        width: 78px;
        opacity: 0.34;
      }

      .house-left {
        left: -12px;
        top: 39%;
      }

      .grass-left {
        left: 9%;
        top: 51%;
      }

      .house-right {
        right: -12px;
        top: 40%;
      }

      .grass-right {
        right: 8%;
        top: 52%;
      }

      .section-title {
        font-size: 0.82rem;
        letter-spacing: 0.21em;
      }

      .section-title::before,
      .section-title::after {
        width: 30px;
      }

      .song {
        grid-template-columns: 43px 1fr 28px;
        min-height: 74px;
        padding: 10px 13px;
        border-radius: 16px;
      }

      .song-title {
        font-size: 1rem;
      }

      .arrow {
        font-size: 1.7rem;
      }

      .s2,
      .s5,
      .s8,
      .s11,
      .s16 {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <!-- LÍNEAS DECORATIVAS -->
    <div class="line one"></div>
    <div class="line two"></div>
    <div class="line three"></div>
    <div class="line four"></div>


    <!-- ESTRELLAS Y DESTELLOS -->

    <div class="star cross twinkle s1"></div>
    <div class="star diamond gold twinkle delay-1 s2"></div>
    <div class="star dot twinkle slow s3"></div>
    <div class="star cross small gold twinkle delay-2 s4"></div>
    <div class="star diamond twinkle delay-3 s5"></div>
    <div class="star cross twinkle slow s6"></div>
    <div class="star dot gold twinkle delay-1 s7"></div>
    <div class="star cross small twinkle delay-2 s8"></div>
    <div class="star diamond gold twinkle slow s9"></div>
    <div class="star cross twinkle delay-3 s10"></div>
    <div class="star cross small gold twinkle delay-1 s11"></div>
    <div class="star diamond twinkle slow s12"></div>
    <div class="star dot twinkle delay-2 s13"></div>
    <div class="star cross small twinkle delay-3 s14"></div>
    <div class="star diamond gold twinkle s15"></div>
    <div class="star cross small twinkle delay-1 s16"></div>
    <div class="star dot gold twinkle slow s17"></div>
    <div class="star cross twinkle delay-2 s18"></div>


    <!-- BARRACAS Y HIERBAS -->

    <div class="scenery">

      <img
        src="House.png"
        class="house house-left"
        alt=""
      >

      <img
        src="hierba.png"
        class="grass grass-left"
        alt=""
      >

      <img
        src="House.png"
        class="house house-right"
        alt=""
      >

      <img
        src="hierba.png"
        class="grass grass-right"
        alt=""
      >

    </div>


    <!-- CONTENIDO -->

    <div class="content">

      <header>

        <!-- TÍTULO CURVO REAL CON SVG -->

        <div class="logo-wrap">

          <svg
            class="logo-svg"
            viewBox="0 0 700 175"
            aria-label="Lolo y la Yaya"
            role="img"
          >

            <defs>

              <!--
                Arco hacia abajo:
                el centro está más abajo que los extremos
              -->

              <path
                id="titleArc"
                d="M 95,72 Q 350,135 605,72"
                fill="none"
              />

            </defs>

            <text
              class="logo-text logo-shine"
              font-size="72"
            >
              <textPath
                href="#titleArc"
                startOffset="50%"
                text-anchor="middle"
              >
                LOLO Y LA YAYA
              </textPath>
            </text>

          </svg>

        </div>

        <p class="subtitle">
          La música de Lolo y la Yaya
        </p>

        <div class="ornament">
          <span class="ornament-star">✦</span>
        </div>

      </header>


      <!-- LOLO -->

      <div class="lolo-area">

        <img
          src="lolo.png"
          class="lolo"
          alt="Lolo"
        >

      </div>


      <!-- CANCIONES -->

      <section class="songs-section">

        <h2 class="section-title">
          Las canciones
        </h2>

        <nav class="songs" aria-label="Canciones">

          <a href="por-si-algun-dia.html" class="song">
            <span class="song-number">01</span>
            <span class="song-title">Por si algún día</span>
            <span class="arrow">›</span>
          </a>

          <a href="no-me-aplastes.html" class="song">
            <span class="song-number">02</span>
            <span class="song-title">
              No me aplastes, soy un héroe
            </span>
            <span class="arrow">›</span>
          </a>

          <a href="basura-con-estilo.html" class="song">
            <span class="song-number">03</span>
            <span class="song-title">
              Basura con estilo
            </span>
            <span class="arrow">›</span>
          </a>

          <a href="molestar-por-la-noche.html" class="song">
            <span class="song-number">04</span>
            <span class="song-title">
              Molestar por la noche, dormir todo el día
            </span>
            <span class="arrow">›</span>
          </a>

          <a href="una-espia-intergalactica.html" class="song">
            <span class="song-number">05</span>
            <span class="song-title">
              Una espía intergaláctica
            </span>
            <span class="arrow">›</span>
          </a>

          <a href="la-leyenda-de-lolo-y-la-yaya.html" class="song">
            <span class="song-number">06</span>
            <span class="song-title">
              La leyenda de Lolo y la Yaya
            </span>
            <span class="arrow">›</span>
          </a>

        </nav>

      </section>


      <footer>
        <span>✦</span>
        Lolo y la Yaya
        <span>✦</span>
      </footer>

    </div>

  </main>

</body>
</html>
