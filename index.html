<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lolo y la Yaya | La música</title>

  <meta name="theme-color" content="#f5ecd7">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lilita+One&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --cream: #f5ecd7;
      --cream-light: #fff9ed;
      --cream-card: rgba(255, 250, 239, 0.72);
      --blue: #164a78;
      --blue-dark: #0d3558;
      --gold: #c69a52;
      --text: #382f27;
      --line: rgba(88, 65, 42, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #f5ecd7 !important;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255,255,255,0.85) 0%,
          rgba(255,249,235,0.4) 28%,
          rgba(245,236,215,0.9) 70%
        ),
        #f5ecd7 !important;

      color: var(--text);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;

      -webkit-text-size-adjust: 100%;
      color-scheme: light only;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      opacity: 0.42;

      background-image:
        radial-gradient(
          rgba(105, 82, 53, 0.22) 0.7px,
          transparent 0.7px
        );

      background-size: 12px 12px;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    /* =========================
       ESTRELLAS DEL FONDO
    ========================== */

    .star {
      position: absolute;
      color: var(--blue);
      pointer-events: none;
      opacity: 0.65;
    }

    .star::before {
      content: "✦";
      display: block;
    }

    .star.small {
      font-size: 13px;
    }

    .star.medium {
      font-size: 22px;
    }

    .star.large {
      font-size: 32px;
    }

    .twinkle-1 {
      animation: twinkle 4s ease-in-out infinite;
    }

    .twinkle-2 {
      animation: twinkle 5.5s ease-in-out infinite 1s;
    }

    .twinkle-3 {
      animation: twinkle 6.5s ease-in-out infinite 2s;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.18;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.18);
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.9));
      }
    }

    /* =========================
       TRAZOS DECORATIVOS
    ========================== */

    .orbit {
      position: absolute;
      border: 1px dotted rgba(22, 74, 120, 0.24);
      border-radius: 50%;
      pointer-events: none;
    }

    .orbit.one {
      width: 900px;
      height: 420px;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
    }

    .orbit.two {
      width: 1200px;
      height: 650px;
      bottom: 180px;
      left: 50%;
      transform: translateX(-50%) rotate(-7deg);
      opacity: 0.55;
    }

    /* =========================
       CABECERA
    ========================== */

    header {
      position: relative;
      z-index: 3;

      width: 100%;
      text-align: center;

      padding:
        clamp(45px, 7vw, 90px)
        20px
        20px;
    }

    .title {
      margin: 0;

      color: var(--blue-dark);

      font-family: "Lilita One", cursive;
      font-weight: 400;

      font-size: clamp(48px, 7vw, 104px);
      line-height: 0.9;

      letter-spacing: 0.02em;

      transform: rotate(-1.2deg);

      text-shadow:
        0 2px 0 rgba(255,255,255,0.55),
        0 8px 20px rgba(22,74,120,0.08);

      white-space: nowrap;
    }

    .subtitle {
      margin-top: 24px;

      font-size: clamp(17px, 2vw, 25px);
      font-weight: 500;

      letter-spacing: 0.03em;

      color: rgba(56,47,39,0.9);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;

      margin-top: 25px;
    }

    .divider::before,
    .divider::after {
      content: "";

      width: 65px;
      height: 1px;

      background: rgba(22,74,120,0.45);
    }

    .divider span {
      color: var(--blue);
      font-size: 23px;

      animation: twinkle 4s ease-in-out infinite;
    }

    /* =========================
       LOLO
    ========================== */

    .hero {
      position: relative;
      z-index: 3;

      display: flex;
      justify-content: center;

      padding: 10px 20px 0;
    }

    .lolo-wrap {
      position: relative;
      width: min(390px, 72vw);
    }

    .lolo-wrap::after {
      content: "";

      position: absolute;

      width: 78%;
      height: 28px;

      left: 11%;
      bottom: 3%;

      border-radius: 50%;

      background: rgba(76, 57, 38, 0.12);

      filter: blur(12px);

      z-index: -1;
    }

    .lolo {
      display: block;

      width: 100%;
      height: auto;

      filter:
        drop-shadow(0 14px 20px rgba(46, 37, 28, 0.14));
    }

    /* =========================
       DECORACIÓN INFERIOR
    ========================== */

    .scenery {
      position: absolute;

      left: 0;
      right: 0;

      top: clamp(470px, 52vw, 620px);

      height: 420px;

      pointer-events: none;

      z-index: 1;
    }

    .house {
      position: absolute;

      width: clamp(150px, 18vw, 260px);

      opacity: 0.32;

      filter: saturate(0.75);
    }

    .house.left {
      left: -25px;
      bottom: 20px;
    }

    .house.right {
      right: -25px;
      bottom: 25px;

      transform: scaleX(-1);
    }

    .grass {
      position: absolute;

      width: clamp(100px, 13vw, 200px);

      opacity: 0.32;
    }

    .grass.left {
      left: 14%;
      bottom: 0;
    }

    .grass.right {
      right: 13%;
      bottom: 0;

      transform: scaleX(-1);
    }

    /* =========================
       CANCIONES
    ========================== */

    .songs-section {
      position: relative;
      z-index: 4;

      width: min(760px, calc(100% - 32px));

      margin: 50px auto 0;

      padding-bottom: 60px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;

      margin: 0 0 24px;

      color: var(--blue-dark);

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 0.32em;

      text-transform: uppercase;
    }

    .section-title::before,
    .section-title::after {
      content: "";

      width: 65px;
      height: 1px;

      border-top: 1px dotted rgba(22,74,120,0.6);
    }

    .songs {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song {
      position: relative;

      display: grid;

      grid-template-columns: 52px 1fr 32px;

      align-items: center;

      min-height: 76px;

      padding: 14px 22px;

      text-decoration: none;

      color: var(--text);

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,0.72),
          rgba(255,248,231,0.54)
        );

      border:
        1px solid rgba(129, 100, 62, 0.18);

      border-radius: 18px;

      box-shadow:
        0 6px 20px rgba(75, 57, 37, 0.045);

      backdrop-filter: blur(4px);

      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
    }

    .song:hover {
      transform: translateY(-3px);

      border-color: rgba(22,74,120,0.35);

      box-shadow:
        0 12px 30px rgba(50, 45, 36, 0.10);
    }

    .song:active {
      transform: scale(0.985);
    }

    .number {
      color: var(--blue);

      font-size: 16px;
      font-weight: 600;

      letter-spacing: 0.04em;
    }

    .song-name {
      padding-right: 12px;

      font-size: clamp(16px, 2.2vw, 20px);
      font-weight: 500;

      line-height: 1.25;
    }

    .arrow {
      color: var(--blue);

      font-size: 34px;

      font-weight: 300;

      line-height: 1;

      transition: transform 0.22s ease;
    }

    .song:hover .arrow {
      transform: translateX(4px);
    }

    /* =========================
       PIE
    ========================== */

    footer {
      position: relative;
      z-index: 4;

      padding: 0 20px 50px;

      text-align: center;

      color: rgba(56,47,39,0.8);

      font-size: 16px;
      font-weight: 500;

      letter-spacing: 0.03em;
    }

    .footer-stars {
      color: var(--blue);

      margin: 0 9px;

      font-size: 18px;
    }

    /* =========================
       POSICIÓN DE ESTRELLAS
    ========================== */

    .s1 { top: 90px; left: 6%; }
    .s2 { top: 180px; right: 8%; }
    .s3 { top: 310px; left: 10%; }
    .s4 { top: 440px; right: 6%; }
    .s5 { top: 670px; left: 4%; }
    .s6 { top: 780px; right: 9%; }
    .s7 { top: 1120px; left: 7%; }
    .s8 { top: 1320px; right: 7%; }
    .s9 { bottom: 230px; left: 9%; }
    .s10 { bottom: 110px; right: 12%; }

    /* =========================
       MÓVIL
    ========================== */

    @media (max-width: 600px) {

      html,
      body {
        background: #f5ecd7 !important;
      }

      body {
        min-height: 100dvh;
      }

      header {
        padding-top: 48px;
      }

      .title {
        font-size: clamp(42px, 13vw, 62px);
        white-space: nowrap;
        letter-spacing: 0;
      }

      .subtitle {
        margin-top: 20px;
        font-size: 17px;
      }

      .lolo-wrap {
        width: min(310px, 78vw);
      }

      .scenery {
        top: 430px;
        height: 360px;
      }

      .house {
        width: 150px;
        opacity: 0.24;
      }

      .grass {
        width: 105px;
        opacity: 0.27;
      }

      .house.left {
        left: -55px;
      }

      .house.right {
        right: -55px;
      }

      .grass.left {
        left: 7%;
      }

      .grass.right {
        right: 5%;
      }

      .songs-section {
        width: calc(100% - 28px);
        margin-top: 38px;
      }

      .section-title {
        font-size: 13px;
        letter-spacing: 0.22em;
        gap: 12px;
      }

      .section-title::before,
      .section-title::after {
        width: 38px;
      }

      .song {
        grid-template-columns: 43px 1fr 25px;

        min-height: 74px;

        padding:
          13px
          15px;

        border-radius: 16px;
      }

      .number {
        font-size: 15px;
      }

      .song-name {
        font-size: 17px;
      }

      .arrow {
        font-size: 30px;
      }

      footer {
        padding-bottom: 40px;
      }

      .orbit.one {
        width: 700px;
        height: 360px;
        top: 120px;
      }

      .orbit.two {
        width: 800px;
        height: 420px;
      }

    }

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background: #f5ecd7 !important;
        color: #382f27 !important;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <!-- ESTRELLAS -->

    <div class="star medium twinkle-1 s1"></div>
    <div class="star small twinkle-2 s2"></div>
    <div class="star medium twinkle-3 s3"></div>
    <div class="star large twinkle-1 s4"></div>
    <div class="star medium twinkle-2 s5"></div>
    <div class="star small twinkle-3 s6"></div>
    <div class="star large twinkle-2 s7"></div>
    <div class="star medium twinkle-1 s8"></div>
    <div class="star small twinkle-2 s9"></div>
    <div class="star medium twinkle-3 s10"></div>

    <!-- ÓRBITAS DECORATIVAS -->

    <div class="orbit one"></div>
    <div class="orbit two"></div>

    <!-- CABECERA -->

    <header>

      <h1 class="title">Lolo y la Yaya</h1>

      <div class="subtitle">
        La música de Lolo y la Yaya
      </div>

      <div class="divider">
        <span>✦</span>
      </div>

    </header>

    <!-- LOLO -->

    <section class="hero">

      <div class="lolo-wrap">
        <img
          src="lolo.png"
          alt="Lolo"
          class="lolo"
        >
      </div>

    </section>

    <!-- PAISAJE -->

    <div class="scenery">

      <img
        src="House.png"
        alt=""
        class="house left"
      >

      <img
        src="House.png"
        alt=""
        class="house right"
      >

      <img
        src="hierba.png"
        alt=""
        class="grass left"
      >

      <img
        src="hierba.png"
        alt=""
        class="grass right"
      >

    </div>

    <!-- CANCIONES -->

    <section class="songs-section">

      <h2 class="section-title">
        Las canciones
      </h2>

      <div class="songs">

        <a class="song" href="por-si-algun-dia.html">
          <span class="number">01</span>
          <span class="song-name">Por si algún día</span>
          <span class="arrow">›</span>
        </a>

        <a class="song" href="no-me-aplastes.html">
          <span class="number">02</span>
          <span class="song-name">No me aplastes, soy un héroe</span>
          <span class="arrow">›</span>
        </a>

        <a class="song" href="basura-con-estilo.html">
          <span class="number">03</span>
          <span class="song-name">Basura con estilo</span>
          <span class="arrow">›</span>
        </a>

        <a class="song" href="molestar-por-la-noche.html">
          <span class="number">04</span>
          <span class="song-name">Molestar por la noche, dormir todo el día</span>
          <span class="arrow">›</span>
        </a>

        <a class="song" href="una-espia-intergalactica.html">
          <span class="number">05</span>
          <span class="song-name">Una espía intergaláctica</span>
          <span class="arrow">›</span>
        </a>

        <a class="song" href="la-leyenda-de-lolo-y-la-yaya.html">
          <span class="number">06</span>
          <span class="song-name">La leyenda de Lolo y la Yaya</span>
          <span class="arrow">›</span>
        </a>

      </div>

    </section>

    <!-- PIE -->

    <footer>

      <span class="footer-stars">✦</span>

      Lolo y la Yaya

      <span class="footer-stars">✦</span>

    </footer>

  </main>

</body>
</html>
