<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="color-scheme" content="light">

  <title>Por si algún día | Lolo y la Yaya</title>

  <meta
    name="description"
    content="Escucha Por si algún día, de Lolo y la Yaya"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bevan&family=Bitter:wght@700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ================================
       BASE
    ================================= */

    :root {

      color-scheme: light only;

      --crema: #f4eedf;
      --crema-claro: #faf6eb;

      --azul: #123e68;
      --azul-suave: #2d628e;

      --texto: #3c352e;

      --dorado: #b88a3b;

    }


    * {
      box-sizing: border-box;
    }


    html {

      min-height: 100%;

      background: var(--crema) !important;

      color-scheme: light !important;

    }


    body {

      margin: 0;

      min-width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;

      background-color: var(--crema) !important;

      color: var(--texto);

      font-family: 'Lora', Georgia, serif;

      -webkit-text-size-adjust: 100%;

    }


    /* ================================
       FONDO
    ================================= */

    .page {

      position: relative;

      min-height: 100vh;
      min-height: 100dvh;

      overflow: hidden;

      background:

        radial-gradient(
          circle at 50% 40%,
          rgba(255,255,255,0.72) 0%,
          rgba(255,255,255,0.28) 32%,
          transparent 62%
        ),

        radial-gradient(
          circle at 15% 20%,
          rgba(255,255,255,0.45),
          transparent 28%
        ),

        radial-gradient(
          circle at 85% 75%,
          rgba(255,255,255,0.32),
          transparent 30%
        ),

        var(--crema);

    }


    .page::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0.22;

      background-image:

        radial-gradient(
          rgba(81, 66, 45, 0.35) 0.7px,
          transparent 0.8px
        );

      background-size: 17px 17px;

      z-index: 0;

    }


    /* ================================
       ESTRELLAS DE FONDO
    ================================= */

    .stars {

      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 1;

      background-image:

        radial-gradient(
          circle,
          rgba(20,62,104,0.75) 1px,
          transparent 1.8px
        ),

        radial-gradient(
          circle,
          var(--dorado) 1px,
          transparent 2px
        );

      background-size:
        137px 173px,
        211px 197px;

      background-position:
        12px 30px,
        90px 80px;

      opacity: 0.55;

    }


    .star {

      position: absolute;

      color: var(--azul);

      font-size: 24px;

      line-height: 1;

      opacity: 0.65;

      animation: twinkle 5s ease-in-out infinite;

      pointer-events: none;

      z-index: 2;

    }


    .star::before {
      content: "✦";
    }


    .star.gold {
      color: var(--dorado);
    }


    .star.one {
      top: 8%;
      left: 8%;
      font-size: 20px;
    }


    .star.two {
      top: 14%;
      right: 10%;
      font-size: 30px;
      animation-delay: 1s;
    }


    .star.three {
      top: 34%;
      left: 7%;
      font-size: 18px;
      animation-delay: 2.2s;
    }


    .star.four {
      top: 58%;
      right: 8%;
      font-size: 25px;
      animation-delay: 3.1s;
    }


    .star.five {
      bottom: 16%;
      left: 12%;
      font-size: 18px;
      animation-delay: 1.5s;
    }


    .star.six {
      top: 25%;
      left: 42%;
      font-size: 15px;
      animation-delay: 0.6s;
    }


    .star.seven {
      top: 48%;
      right: 28%;
      font-size: 17px;
      animation-delay: 2.7s;
    }


    .star.eight {
      top: 4%;
      left: 32%;
      font-size: 16px;
      animation-delay: 1.9s;
    }


    .star.nine {
      top: 20%;
      right: 23%;
      font-size: 14px;
      animation-delay: 0.3s;
    }


    .star.ten {
      top: 68%;
      left: 25%;
      font-size: 13px;
      animation-delay: 3.6s;
    }


    .star.eleven {
      bottom: 8%;
      right: 15%;
      font-size: 16px;
      animation-delay: 1.1s;
    }


    @keyframes twinkle {

      0%, 100% {

        opacity: 0.3;

        transform: scale(0.85);

      }


      50% {

        opacity: 1;

        transform: scale(1.2);

      }

    }


    /* ================================
       LUCIÉRNAGAS / DESTELLOS
    ================================= */

    .firefly-bg {

      position: absolute;

      z-index: 2;

      width: 5px;

      height: 5px;

      border-radius: 50%;

      background: var(--dorado);

      box-shadow:
        0 0 7px 2px rgba(184,138,59,0.75);

      opacity: 0;

      animation: fireflyDrift 7s ease-in-out infinite;

      pointer-events: none;

    }


    .firefly-bg.b1 {
      top: 10%;
      left: 15%;
      animation-delay: 0.4s;
    }

    .firefly-bg.b2 {
      top: 24%;
      right: 14%;
      animation-delay: 2.1s;
    }

    .firefly-bg.b3 {
      top: 44%;
      left: 8%;
      animation-delay: 3.8s;
    }

    .firefly-bg.b4 {
      top: 60%;
      right: 12%;
      animation-delay: 1.2s;
    }

    .firefly-bg.b5 {
      top: 78%;
      left: 20%;
      animation-delay: 4.6s;
    }

    .firefly-bg.b6 {
      top: 88%;
      right: 24%;
      animation-delay: 2.9s;
    }


    @keyframes fireflyDrift {

      0% {

        opacity: 0;

        transform: translate(0,0) scale(0.8);

      }


      20% {
        opacity: 0.9;
      }


      50% {

        opacity: 0.5;

        transform:
          translate(10px,-16px)
          scale(1.15);

      }


      80% {

        opacity: 0.85;

        transform:
          translate(-6px,-6px)
          scale(0.9);

      }


      100% {

        opacity: 0;

        transform:
          translate(4px,-24px)
          scale(0.7);

      }

    }


    /* ================================
       CONTENIDO
    ================================= */

    .content {

      position: relative;

      z-index: 5;

      width: 100%;

      max-width: 900px;

      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 auto;

      padding:
        34px
        40px
        90px;

      display: flex;

      flex-direction: column;

    }


    /* ================================
       VOLVER
    ================================= */

    .back {

      position: relative;

      z-index: 10;

      align-self: flex-start;

      display: inline-flex;

      align-items: center;

      gap: 9px;

      color: var(--azul);

      text-decoration: none;

      font-family: 'Bitter', Georgia, serif;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: 0.04em;

      padding:
        10px
        14px;

      border-radius: 12px;

      transition:
        background 0.2s ease,
        transform 0.2s ease;

      -webkit-tap-highlight-color: transparent;

    }


    .back::before {

      content: "←";

      font-size: 22px;

      line-height: 1;

      transition:
        transform 0.2s ease;

    }


    .back:hover {

      background:
        rgba(255,255,255,0.42);

    }


    .back:hover::before {

      transform:
        translateX(-4px);

    }


    .back:active {

      transform:
        scale(0.98);

    }


    /* ================================
       ZONA CENTRAL
    ================================= */

    .song-area {

      position: relative;

      z-index: 5;

      flex: 1;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding:
        40px
        20px
        70px;

    }


    /* ================================
       NÚMERO
    ================================= */

    .song-number {

      color: var(--dorado);

      font-family: 'Bitter', Georgia, serif;

      font-size: 15px;

      font-weight: 700;

      letter-spacing: 0.22em;

      margin-bottom: 22px;

    }


    /* ================================
       TÍTULO
    ================================= */

    .song-title {

      margin: 0;

      color: var(--azul);

      font-family: 'Bevan', Georgia, serif;

      font-size:
        clamp(34px, 6vw, 66px);

      font-weight: 400;

      line-height: 1.08;

      letter-spacing: 0.015em;

      max-width: 760px;

      text-shadow:

        0 2px 0
        rgba(255,255,255,0.65);

    }


    /* ================================
       ADORNO
    ================================= */

    .ornament {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 16px;

      margin:
        30px
        0
        42px;

      color: var(--dorado);

      opacity: 0.9;

    }


    .ornament::before,
    .ornament::after {

      content: "";

      width: 75px;

      height: 1px;

      background:
        var(--azul);

      opacity: 0.55;

    }


    .ornament span {

      font-size: 22px;

      line-height: 1;

      animation:
        ornamentGlow
        4s
        ease-in-out
        infinite;

    }


    @keyframes ornamentGlow {

      0%, 100% {

        transform: scale(0.9);

        opacity: 0.55;

      }


      50% {

        transform: scale(1.25);

        opacity: 1;

      }

    }


    /* ================================
       REPRODUCTOR
    ================================= */

    .player {

      width: min(100%, 620px);

      padding:
        32px
        38px
        28px;

      border:

        1px solid
        rgba(141,111,70,0.28);

      border-radius: 26px;

      background:

        rgba(255,255,255,0.38);

      box-shadow:

        0 18px 50px
        rgba(91,70,40,0.10),

        inset
        0 1px 0
        rgba(255,255,255,0.7);

      backdrop-filter:
        blur(4px);

    }


    /* BOTÓN PLAY */

    .play-button {

      width: 92px;

      height: 92px;

      margin:
        0 auto
        28px;

      border: none;

      border-radius: 50%;

      background:

        var(--azul);

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow:

        0 8px 22px
        rgba(18,62,104,0.25);

      transition:

        transform 0.2s ease,

        background 0.2s ease,

        box-shadow 0.2s ease;

      -webkit-tap-highlight-color: transparent;

    }


    .play-button:hover {

      transform:
        scale(1.07);

      background:
        var(--azul-suave);

      box-shadow:

        0 12px 30px
        rgba(18,62,104,0.32);

    }


    .play-button:active {

      transform:
        scale(0.96);

    }


    /* TRIÁNGULO PLAY */

    .play-symbol {

      width: 0;

      height: 0;

      margin-left: 7px;

      border-top:
        15px solid transparent;

      border-bottom:
        15px solid transparent;

      border-left:
        24px solid #f6ecd4;

    }


    /* PAUSA */

    .play-button.playing .play-symbol {

      width: 24px;

      height: 30px;

      margin-left: 0;

      border: none;

      background:

        linear-gradient(
          to right,

          #f6ecd4 0,
          #f6ecd4 8px,

          transparent 8px,
          transparent 16px,

          #f6ecd4 16px,
          #f6ecd4 24px
        );

    }


    /* BARRA */

    .progress-container {

      position: relative;

      width: 100%;

      height: 7px;

      border-radius: 20px;

      background:

        rgba(18,62,104,0.14);

      overflow: hidden;

      cursor: pointer;

      margin-bottom: 14px;

    }


    .progress {

      width: 0%;

      height: 100%;

      border-radius: inherit;

      background:

        linear-gradient(
          90deg,

          var(--dorado),

          #d6ae63
        );

      transition:
        width 0.1s linear;

    }


    /* TIEMPO */

    .time-row {

      display: flex;

      justify-content: space-between;

      color: var(--texto);

      font-family:
        'Bitter',
        Georgia,
        serif;

      font-size: 14px;

      font-weight: 700;

      opacity: 0.78;

    }


    /* ================================
       PAISAJE INFERIOR
    ================================= */

    .landscape {

      position: absolute;

      z-index: 2;

      left: 0;

      right: 0;

      bottom: 0;

      height: 280px;

      pointer-events: none;

    }


    .house {

      position: absolute;

      width:
        clamp(130px, 16vw, 220px);

      height: auto;

      opacity: 0.42;

      bottom: 12px;

    }


    .house.left {

      left:
        clamp(-30px, 4vw, 45px);

    }


    .house.right {

      right:
        clamp(-30px, 4vw, 45px);

      transform:
        scaleX(-1);

    }


    .grass {

      position: absolute;

      width:
        clamp(60px, 7vw, 110px);

      height: auto;

      opacity: 0.46;

      bottom: -4px;

    }


    .grass.left.one {
      left: 14%;
    }

    .grass.left.two {
      left: 25%;
      transform: scale(0.78);
      opacity: 0.34;
    }

    .grass.right.one {
      right: 14%;
      transform: scaleX(-1);
    }

    .grass.right.two {
      right: 25%;
      transform: scale(-0.78, 0.78);
      opacity: 0.34;
    }


    /* ================================
       MÓVIL
    ================================= */

    @media (max-width: 700px) {

      body {

        background:
          var(--crema)
          !important;

      }


      .page {

        min-height:
          100dvh;

        background:

          radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,0.82),
            transparent 42%
          ),

          radial-gradient(
            circle at 15% 85%,
            rgba(255,255,255,0.35),
            transparent 28%
          ),

          var(--crema)
          !important;

      }


      .content {

        min-height:
          100dvh;

        padding:

          20px
          18px
          60px;

      }


      .back {

        padding:
          8px
          4px;

        font-size:
          13px;

      }


      .song-area {

        padding:

          35px
          4px
          100px;

        justify-content:
          center;

      }


      .song-number {

        margin-bottom:
          18px;

        font-size:
          13px;

      }


      .song-title {

        font-size:
          clamp(31px, 10vw, 46px);

        max-width:
          100%;

      }


      .ornament {

        margin:

          24px
          0
          34px;

      }


      .ornament::before,
      .ornament::after {

        width:
          48px;

      }


      .player {

        padding:

          28px
          22px
          24px;

        border-radius:
          22px;

        background:

          rgba(255,255,255,0.48);

      }


      .play-button {

        width:
          82px;

        height:
          82px;

        margin-bottom:
          24px;

      }


      .house {

        width:
          105px;

        opacity:
          0.38;

        bottom:
          5px;

      }


      .house.left {
        left: -28px;
      }


      .house.right {
        right: -28px;
      }


      .grass {

        width:
          58px;

        opacity:
          0.42;

      }


      .grass.left.one {
        left: 13%;
      }


      .grass.left.two {
        left: 28%;
      }


      .grass.right.one {
        right: 13%;
      }


      .grass.right.two {
        right: 28%;
      }


      .landscape {

        height:
          210px;

      }

    }


    /* ================================
       ACCESIBILIDAD
    ================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms
          !important;

        animation-iteration-count:
          1
          !important;

        transition-duration:
          0.01ms
          !important;

      }

    }

  </style>

</head>


<body>


  <div class="page">


    <!-- FONDO -->

    <div class="stars"></div>


    <!-- ESTRELLAS -->

    <div class="star one"></div>
    <div class="star two gold"></div>
    <div class="star three"></div>
    <div class="star four gold"></div>
    <div class="star five"></div>
    <div class="star six gold"></div>
    <div class="star seven"></div>
    <div class="star eight gold"></div>
    <div class="star nine"></div>
    <div class="star ten gold"></div>
    <div class="star eleven"></div>


    <!-- DESTELLOS -->

    <span
      class="firefly-bg b1"
      aria-hidden="true"
    ></span>

    <span
      class="firefly-bg b2"
      aria-hidden="true"
    ></span>

    <span
      class="firefly-bg b3"
      aria-hidden="true"
    ></span>

    <span
      class="firefly-bg b4"
      aria-hidden="true"
    ></span>

    <span
      class="firefly-bg b5"
      aria-hidden="true"
    ></span>

    <span
      class="firefly-bg b6"
      aria-hidden="true"
    ></span>


    <!-- CONTENIDO -->

    <main class="content">


      <!-- VOLVER -->

      <a
        href="../index.html"
        class="back"
      >

        Volver a las canciones

      </a>


      <!-- CANCIÓN -->

      <section class="song-area">


        <div class="song-number">
          06
        </div>


        <h1 class="song-title">

         La leyenda de Lolo y la Yaya

        </h1>


        <div class="ornament">

          <span>✦</span>

        </div>


        <!-- REPRODUCTOR -->

        <div class="player">


          <button
            class="play-button"
            id="playButton"
            aria-label="Reproducir canción"
          >

            <span class="play-symbol"></span>

          </button>


          <div
            class="progress-container"
            id="progressContainer"
          >

            <div
              class="progress"
              id="progress"
            ></div>

          </div>


          <div class="time-row">

            <span id="currentTime">
              0:00
            </span>

            <span id="duration">
              0:00
            </span>

          </div>


          <!-- AUDIO -->

          <audio
            id="audio"
            preload="metadata"
          >

            <source
              src="../audio/la-leyenda-de-lolo-y-la-yaya.mp3"
              type="audio/mpeg"
            >

            Tu navegador no puede reproducir este audio.

          </audio>


        </div>


      </section>


    </main>


    <!-- PAISAJE -->

    <div class="landscape">


      <img
        src="../House.png"
        class="house left"
        alt=""
        aria-hidden="true"
      >


      <img
        src="../House.png"
        class="house right"
        alt=""
        aria-hidden="true"
      >


      <img
        src="../hierba.png"
        class="grass left one"
        alt=""
        aria-hidden="true"
      >


      <img
        src="../hierba.png"
        class="grass left two"
        alt=""
        aria-hidden="true"
      >


      <img
        src="../hierba.png"
        class="grass right one"
        alt=""
        aria-hidden="true"
      >


      <img
        src="../hierba.png"
        class="grass right two"
        alt=""
        aria-hidden="true"
      >


    </div>


  </div>


  <script>


    const audio =
      document.getElementById("audio");


    const playButton =
      document.getElementById("playButton");


    const progress =
      document.getElementById("progress");


    const progressContainer =
      document.getElementById("progressContainer");


    const currentTime =
      document.getElementById("currentTime");


    const duration =
      document.getElementById("duration");


    /* REPRODUCIR / PAUSAR */

    playButton.addEventListener(
      "click",
      () => {

        if (audio.paused) {

          audio.play();

        } else {

          audio.pause();

        }

      }
    );


    /* CAMBIO VISUAL DEL BOTÓN */

    audio.addEventListener(
      "play",
      () => {

        playButton.classList.add(
          "playing"
        );

        playButton.setAttribute(
          "aria-label",
          "Pausar canción"
        );

      }
    );


    audio.addEventListener(
      "pause",
      () => {

        playButton.classList.remove(
          "playing"
        );

        playButton.setAttribute(
          "aria-label",
          "Reproducir canción"
        );

      }
    );


    /* DURACIÓN */

    audio.addEventListener(
      "loadedmetadata",
      () => {

        duration.textContent =
          formatTime(audio.duration);

      }
    );


    /* PROGRESO */

    audio.addEventListener(
      "timeupdate",
      () => {

        if (!audio.duration) return;


        const percentage =
          (audio.currentTime / audio.duration)
          * 100;


        progress.style.width =
          percentage + "%";


        currentTime.textContent =
          formatTime(audio.currentTime);

      }
    );


    /* MOVERSE EN LA BARRA */

    progressContainer.addEventListener(
      "click",
      (event) => {

        const rect =
          progressContainer.getBoundingClientRect();


        const position =
          event.clientX - rect.left;


        const percentage =
          position / rect.width;


        if (audio.duration) {

          audio.currentTime =
            percentage * audio.duration;

        }

      }
    );


    /* AL TERMINAR */

    audio.addEventListener(
      "ended",
      () => {

        playButton.classList.remove(
          "playing"
        );


        progress.style.width =
          "100%";

      }
    );


    /* FORMATO 0:00 */

    function formatTime(seconds) {

      if (
        isNaN(seconds) ||
        !isFinite(seconds)
      ) {

        return "0:00";

      }


      const minutes =
        Math.floor(seconds / 60);


      const remainingSeconds =
        Math.floor(seconds % 60);


      return (
        minutes
        + ":"
        + remainingSeconds
          .toString()
          .padStart(2, "0")
      );

    }


  </script>


</body>

</html>
